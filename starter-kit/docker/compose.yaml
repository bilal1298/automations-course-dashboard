# n8n + Postgres for local practice.
#
#   cp .env.example .env      # then edit the passwords and the encryption key
#   docker compose up -d      # start
#   open http://localhost:5678
#   docker compose down       # stop (your data stays in the volumes)
#
# n8n stores its own workflows/credentials in the "n8n" database.
# A second, empty database called "practice" is created for the SQL exercises.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    ports:
      - "5432:5432"            # so you can also connect with psql or a GUI from your laptop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro   # runs once, on the very first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}   # back this up: without it saved credentials can't be decrypted
      GENERIC_TIMEZONE: ${TIMEZONE}
      TZ: ${TIMEZONE}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto          # lets a Code node verify webhook signatures
    extra_hosts:
      - "host.docker.internal:host-gateway"        # reach the mock API on your laptop (Linux needs this line)
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
